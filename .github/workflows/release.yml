name: release

on:
  push:
    tags: ['v*']
    branches: [release-installers]   # so valida o build; so publica em tag
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versao
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar (self-contained, arquivo unico)
        run: >
          dotnet publish src/DeskLink.Windows -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.v.outputs.version }}
          -o publish/win-x64
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Gerar instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceExe=$PWD\publish\win-x64\DeskLink.exe" packaging\windows\DeskLink.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DeskLink-Setup-*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0~dev" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar nfpm
        run: |
          curl -fsSL -o nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb
          sudo dpkg -i nfpm.deb
      - name: Gerar .deb e .rpm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/desklink_${VERSION}_all.deb
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/desklink-${VERSION}.noarch.rpm
      - name: Validar pacote .deb
        run: dpkg-deb -I dist/*.deb && dpkg-deb -c dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
